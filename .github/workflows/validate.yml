name: Validate

on:
  push:
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
          comment: "false"

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Tests and release version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ">=3.14.2 <3.15"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check release tag matches manifest
        if: github.ref_type == 'tag'
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/harf_insoma/manifest.json").read_text()
          )
          expected_tag = f"v{manifest['version']}"
          actual_tag = os.environ["GITHUB_REF_NAME"]
          if actual_tag != expected_tag:
              raise SystemExit(
                  f"Tag {actual_tag!r} does not match manifest: expected {expected_tag!r}"
              )
          print(f"Release tag matches manifest: {expected_tag}")
          PY
